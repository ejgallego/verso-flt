package_name = "FLTBlueprint"
blueprint_main = "FLTBlueprintMain"
formalization_path = "FLT"
chapter_root = "FLTBlueprint/Chapters"
tex_source_glob = "FLT/blueprint/src/chapter/*.tex"

[lt]
default_chapters = [
  "FLTBlueprint/Chapters/Introduction.lean",
  "FLTBlueprint/Chapters/Reductions.lean",
  "FLTBlueprint/Chapters/HardlyRamified.lean",
  "FLTBlueprint/Chapters/Overview.lean",
  "FLTBlueprint/Chapters/AutomorphicFormExample.lean",
  "FLTBlueprint/Chapters/ModularityLifting.lean",
  "FLTBlueprint/Chapters/LanglandsGLn.lean",
  "FLTBlueprint/Chapters/FrobeniusProject.lean",
  "FLTBlueprint/Chapters/AdeleProject.lean",
  "FLTBlueprint/Chapters/HaarCharacters.lean",
  "FLTBlueprint/Chapters/FujisakiProject.lean",
  "FLTBlueprint/Chapters/QuaternionAlgebras.lean",
  "FLTBlueprint/Chapters/HeckeOperators.lean",
  "FLTBlueprint/Chapters/Bestiary.lean",
]
[lt.source_files]
"FLTBlueprint/Chapters/Introduction.lean" = ["FLT/blueprint/src/chapter/ch01introduction.tex"]
"FLTBlueprint/Chapters/Reductions.lean" = ["FLT/blueprint/src/chapter/ch02reductions.tex"]
"FLTBlueprint/Chapters/HardlyRamified.lean" = ["FLT/blueprint/src/chapter/ch03freyreduction.tex"]
"FLTBlueprint/Chapters/Overview.lean" = ["FLT/blueprint/src/chapter/ch04overview.tex"]
"FLTBlueprint/Chapters/AutomorphicFormExample.lean" = ["FLT/blueprint/src/chapter/ch05automorphicformexample.tex"]
"FLTBlueprint/Chapters/ModularityLifting.lean" = ["FLT/blueprint/src/chapter/ch06automorphicrepresentations.tex"]
"FLTBlueprint/Chapters/LanglandsGLn.lean" = ["FLT/blueprint/src/chapter/ch07exampleGLn.tex"]
"FLTBlueprint/Chapters/FrobeniusProject.lean" = ["FLT/blueprint/src/chapter/FrobeniusProject.tex"]
"FLTBlueprint/Chapters/AdeleProject.lean" = ["FLT/blueprint/src/chapter/AdeleMiniproject.tex"]
"FLTBlueprint/Chapters/HaarCharacters.lean" = ["FLT/blueprint/src/chapter/HaarCharacterProject.tex"]
"FLTBlueprint/Chapters/FujisakiProject.lean" = ["FLT/blueprint/src/chapter/FujisakiProject.tex"]
"FLTBlueprint/Chapters/QuaternionAlgebras.lean" = ["FLT/blueprint/src/chapter/QuaternionAlgebraProject.tex"]
"FLTBlueprint/Chapters/HeckeOperators.lean" = ["FLT/blueprint/src/chapter/HeckeOperatorProject.tex"]
"FLTBlueprint/Chapters/Bestiary.lean" = ["FLT/blueprint/src/chapter/chtopbestiary.tex"]

[lt.node_kinds]
proposition = "theorem"

[harness]
native_warnings = false
docstring_warnings = false
strict_external_code = true
